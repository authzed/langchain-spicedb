[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spicedb-rag-auth"
version = "0.1.0"
description = "Universal SpiceDB authorization for RAG pipelines - works with any framework and vector store"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["spicedb", "authorization", "rag", "langchain", "langgraph", "pinecone", "faiss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]

dependencies = [
    "authzed>=0.7.0",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
langgraph = [
    "langgraph>=0.0.20",
]
all = [
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "python-dotenv>=1.0.0",
    "langchain-openai>=0.0.5",
]

[project.urls]
Homepage = "https://github.com/yourusername/spicedb-rag-auth"
Documentation = "https://github.com/yourusername/spicedb-rag-auth#readme"
Repository = "https://github.com/yourusername/spicedb-rag-auth"
Issues = "https://github.com/yourusername/spicedb-rag-auth/issues"
